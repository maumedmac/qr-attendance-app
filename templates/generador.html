<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Códigos QR - Asistencia</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">🛠️ Generador de Códigos QR</h1>
        <div class="space-x-2">
            <a href="/" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-2 rounded-lg text-sm font-semibold transition">Escanear QR 📷</a>
            <a href="/dashboard" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-2 rounded-lg text-sm font-semibold transition">Dashboard 📊</a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container mx-auto p-4 max-w-md flex-grow flex flex-col justify-center">
        <div class="bg-white rounded-xl shadow-lg p-6 space-y-6">
            
            <form id="formQR" onsubmit="generarQR(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Número de Celular (Código QR):</label>
                    <input type="text" id="codigoInput" required placeholder="Ej. 70123456" 
                           class="w-full mt-1 border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre Completo del Asistente:</label>
                    <input type="text" id="nombreInput" required placeholder="Ej. Mauricio Medrano" 
                           class="w-full mt-1 border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-bold transition shadow-md">
                    Generar y Guardar QR
                </button>
            </form>

            <!-- Vista Previa del QR Generado -->
            <div id="previewBox" class="hidden text-center space-y-4 pt-4 border-t border-gray-200">
                <h3 class="font-bold text-gray-800" id="tituloQR">Código QR Generado</h3>
                <div class="flex justify-center">
                    <img id="qrImage" src="" alt="Código QR" class="border p-2 rounded-lg shadow-sm w-48 h-48">
                </div>
                <a id="btnDescargar" href="" download="" class="inline-block bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium transition text-sm">
                    📥 Descargar Imagen QR
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-gray-500">
        Sistema de Control de Asistencia &copy; 2026
    </footer>

    <!-- Lógica JS -->
    <script>
        async function generarQR(e) {
            e.preventDefault();
            const codigo = document.getElementById('codigoInput').value.trim();
            const nombre = document.getElementById('nombreInput').value.trim();

            const formData = new FormData();
            formData.append('codigo', codigo);
            formData.append('nombre', nombre);

            try {
                // 1. Guardar en la base de datos de Render
                const response = await fetch('/api/crear-asistente', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    // 2. Mostrar la imagen del QR generado con el número de celular
                    const qrUrl = `/api/generar-qr/${encodeURIComponent(codigo)}`;
                    document.getElementById('qrImage').src = qrUrl;
                    
                    const btnDescargar = document.getElementById('btnDescargar');
                    btnDescargar.href = qrUrl;
                    btnDescargar.download = `QR_${codigo}_${nombre.replace(/\s+/g, '_')}.png`;

                    document.getElementById('tituloQR').textContent = `QR para: ${nombre} (${codigo})`;
                    document.getElementById('previewBox').classList.remove('hidden');
                } else {
                    alert("Error al registrar: " + data.message);
                }
            } catch (err) {
                console.error(err);
                alert("Error de conexión con el servidor.");
            }
        }
    </script>
</body>
</html>
