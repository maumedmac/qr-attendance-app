<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Asistencia</title>
    <!-- Tailwind CSS CDN -->
    <!-- Enlace al Manifest para PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Tailwind y scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

   <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">📊 Dashboard de Asistencias</h1>
        <div class="space-x-2">
            <a href="/" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-2 rounded-lg text-sm font-semibold transition">Escanear QR 📷</a>
            <a href="/generador" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-2 rounded-lg text-sm font-semibold transition">Generar QR 🛠️</a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container mx-auto p-4 max-w-4xl flex-grow">
        <div class="bg-white rounded-xl shadow-lg p-6 space-y-4">
            
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800">Lista de Asistentes Registrados</h2>
                <button onclick="cargarDashboard()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                    🔄 Actualizar
                </button>
            </div>

            <!-- Tabla de Asistentes -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            <th class="p-3">QR</th>
                            <th class="p-3">Celular (Código)</th>
                            <th class="p-3">Nombre</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3">Hora de Ingreso</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAsistentes" class="divide-y divide-gray-200 text-sm">
                        <!-- Los datos se cargan dinámicamente con JS -->
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-500">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-gray-500">
        Sistema de Control de Asistencia &copy; 2026
    </footer>

    <!-- Lógica JS para cargar datos -->
    <script>
        async function cargarDashboard() {
            try {
                const response = await fetch('/api/dashboard-data');
                const data = await response.json();
                const tbody = document.getElementById('tablaAsistentes');
                tbody.innerHTML = "";

                if (data.asistentes.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No hay asistentes registrados.</td></tr>`;
                    return;
                }

                data.asistentes.forEach(asistente => {
                    const tr = document.createElement('tr');
                    
                    // Definir color del estado
                    const badgeClass = asistente.status === "Entró" 
                        ? "bg-green-100 text-green-800" 
                        : "bg-yellow-100 text-yellow-800";

                    tr.innerHTML = `
                        <td class="p-3">
                            <a href="/api/generar-qr/${asistente.codigo}" target="_blank" title="Ver QR grande">
                                <img src="/api/generar-qr/${asistente.codigo}" alt="QR" class="w-12 h-12 border rounded bg-white p-1 hover:scale-110 transition shadow-sm">
                            </a>
                        </td>
                        <td class="p-3 font-medium text-gray-900">${asistente.codigo}</td>
                        <td class="p-3 text-gray-700">${asistente.name}</td>
                        <td class="p-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">
                                ${asistente.status}
                            </span>
                        </td>
                        <td class="p-3 text-gray-500">${asistente.timestamp}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error al cargar el dashboard:", err);
            }
        }

        // Cargar al abrir la página y refrescar cada 10 segundos automáticamente
        cargarDashboard();
        setInterval(cargarDashboard, 10000);
    </script>
</body>
</html>
